<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- ===== Header ===== -->
    <header id="app-header">
      <h1 class="app-title">Expense Tracker</h1>
      <div class="header-bottom">
      <div id="balance-display" aria-live="polite" aria-label="Total balance">
        $0.00
      </div>
      <button id="theme-toggle" type="button" aria-label="Toggle dark/light mode">
        🌙
      </button>
      </div>
    </header>

    <!-- ===== Main content ===== -->
    <main>

      <!-- Input Form Section -->
      <section id="form-section" aria-labelledby="form-heading">
        <h2 id="form-heading">Add Transaction</h2>

        <form id="transaction-form" novalidate>

          <!-- Item Name -->
          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="item-name"
              maxlength="100"
              placeholder="e.g. Lunch"
              autocomplete="off"
              aria-describedby="error-name"
            />
            <span id="error-name" class="error-message" role="alert" aria-live="polite"></span>
          </div>

          <!-- Amount -->
          <div class="form-group">
            <label for="item-amount">Amount ($)</label>
            <input
              type="number"
              id="item-amount"
              name="item-amount"
              min="0.01"
              max="999999999.99"
              step="0.01"
              placeholder="e.g. 12.50"
              aria-describedby="error-amount"
            />
            <span id="error-amount" class="error-message" role="alert" aria-live="polite"></span>
          </div>

          <!-- Category -->
          <div class="form-group">
            <label for="item-category">Category</label>
            <select
              id="item-category"
              name="item-category"
              aria-describedby="error-category"
            >
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
            <span id="error-category" class="error-message" role="alert" aria-live="polite"></span>
          </div>

          <button type="submit" id="add-btn">Add Transaction</button>

        </form>
      </section>

      <!-- Chart Section -->
      <section id="chart-section" aria-labelledby="chart-heading">
        <h2 id="chart-heading">Spending by Category</h2>
        <canvas id="spending-chart" role="img" aria-label="Pie chart of spending by category"></canvas>
        <p id="chart-placeholder">No spending data available yet.</p>
      </section>

      <!-- Transaction List Section -->
      <section id="list-section" aria-labelledby="list-heading">
        <h2 id="list-heading">Transactions</h2>
        <ul id="transaction-list" aria-label="Transaction list"></ul>
        <p id="empty-state">No transactions recorded yet.</p>
      </section>

    </main>

    <!-- Error Toast -->
    <div id="error-toast" role="alert" aria-live="assertive" aria-atomic="true"></div>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- App script -->
    <script src="js/app.js" defer></script>

  </body>
</html>
